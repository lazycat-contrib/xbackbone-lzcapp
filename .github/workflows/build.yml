name: Build XBackBone LPK
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: xbackbone-lpk
  cancel-in-progress: false
jobs:
  lazycat:
    uses: ca-x/lazycat-github-action/.github/workflows/lazycat.yml@v1
    with:
      operation: auto
      config: .github/lazycat-action.yml
      versioned-release-asset: true
