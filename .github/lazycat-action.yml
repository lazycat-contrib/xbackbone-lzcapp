version: 1
project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64
update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: xbackbone
build:
  toolchains: []
  run_buildscript: false
images:
  - id: xbackbone
    target: service
    service: xbackbone
    source: linuxserver/xbackbone
    channel: stable
    sort: semver
    tag_regex: ^v?[0-9]+[.][0-9]+[.][0-9]+$
    delivery:
      mode: mirror
      require_digest_match: true
stores:
  official:
    enabled: false
  private:
    enabled: true
    name: XBackBone
    summary: 自托管文件分享与中转
    skip_if_version_exists: true
